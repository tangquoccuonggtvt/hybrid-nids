# =============================================================================
# Hybrid-NIDS ELK stack (Elasticsearch + Kibana + Logstash)
#
# BẢO MẬT: Stack này BẬT xác thực (X-Pack security) để bảo vệ chính tầng
# giám sát — tránh nghịch lý "hệ thống bảo vệ mạng nhưng bản thân để cửa mở".
# Các mật khẩu KHÔNG hardcode trong file này; đọc từ biến môi trường
# (deployment/hybrid-nids.env). Sao chép hybrid-nids.env.example -> hybrid-nids.env
# và đặt ELASTIC_PASSWORD, KIBANA_SYSTEM_PASSWORD trước khi chạy:
#
#   docker compose --env-file ../hybrid-nids.env -f docker-compose.yml up -d
# =============================================================================
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: hybrid-nids-elasticsearch
    environment:
      - discovery.type=single-node
      # BẬT xác thực + phân quyền người dùng (mặc định trước đây là false).
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?Phai dat ELASTIC_PASSWORD trong hybrid-nids.env}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      # Health check giờ phải xác thực bằng tài khoản elastic.
      test: ["CMD-SHELL", "curl -fsS -u elastic:${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: hybrid-nids-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Kibana đăng nhập ES bằng tài khoản hệ thống kibana_system (không dùng
      # tài khoản elastic siêu quyền). Mật khẩu đặt qua biến môi trường.
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?Phai dat KIBANA_SYSTEM_PASSWORD trong hybrid-nids.env}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: hybrid-nids-logstash
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - PIPELINE_WORKERS=1
      # Truyền thông tin đăng nhập ES cho pipeline (dùng trong output {}).
      - ES_USER=${ES_USER:-elastic}
      - ES_PASSWORD=${ELASTIC_PASSWORD:?Phai dat ELASTIC_PASSWORD trong hybrid-nids.env}
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ../../logs:/var/log/hybrid-nids:ro
      - /var/log/suricata:/var/log/suricata:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata:
